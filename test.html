  function filtered(){
    const q=state.query.trim().toLowerCase();
    let list=providers.filter(p=>(!q||[p.name,p.category,p.service,...p.skills].join(' ').toLowerCase().includes(q))&&
      (state.category==='All'||p.category===state.category)&&
      (state.distance==='Any'||p.distance<=Number(state.distance))&&
      (state.rating==='Any'||p.rating>=Number(state.rating))&&
      (state.price==='Any'||p.price<=Number(state.price))&&!state.disabledCategories.has(p.category));
    if(state.sort==='Nearest')list.sort((a,b)=>a.distance-b.distance);
    else if(state.sort==='Highest rated')list.sort((a,b)=>b.rating-a.rating);
    else list.sort((a,b)=>(b.rating*20+b.reviews/20-a.distance)-(a.rating*20+a.reviews/20-b.distance));
    return list;
  }

  function navigate(view){state.view=view;state.notice='';state.searchError=false;document.getElementById('mobile-nav').classList.remove('open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false');render();window.scrollTo({top:0,behavior:'smooth'});root.focus({preventScroll:true})}
  function message(text){state.notice=text;render()}
  function contact(id){const p=providers.find(x=>x.id===id);if(!p)return;const host=document.getElementById('modal-host');host.innerHTML=`<div class="modal-backdrop" id="contact-overlay"><section role="dialog" aria-modal="true" aria-labelledby="contact-title" class="modal-card card p-7"><div class="flex justify-between items-start"><div><span class="pill">Demo contact</span><h2 id="contact-title" class="text-2xl font-bold mt-3">Contact ${esc(p.name)}</h2></div><button id="close-modal" aria-label="Close contact panel" class="p-2 rounded-lg hover:bg-slate-100">${icon('x')}</button></div><p class="muted mt-4">Messaging is not connected. This panel does not deliver messages or reveal real contact information.</p><p class="mt-5 bg-blue-50 p-4 rounded-xl text-sm">In a future production app, contact requests would be delivered through a secure messaging service.</p><button id="modal-done" class="btn primary mt-6 w-full">Done</button></section></div>`;refreshIcons();host.querySelector('#close-modal').onclick=closeModal;host.querySelector('#modal-done').onclick=closeModal;host.querySelector('#contact-overlay').onclick=e=>{if(e.target.id==='contact-overlay')closeModal()};host.querySelector('#close-modal').focus()}
  function closeModal(){document.getElementById('modal-host').innerHTML=''}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  document.addEventListener('click',e=>{
    const route=e.target.closest('[data-route]');if(route){navigate(route.dataset.route);return}
    const cat=e.target.closest('[data-category]');if(cat){state.category=cat.dataset.category;state.query='';navigate('results');return}
    const profile=e.target.closest('[data-profile]');if(profile){state.selected=Number(profile.dataset.profile);navigate('profile');return}
    const fav=e.target.closest('[data-favorite]');if(fav){toggleFavorite(Number(fav.dataset.favorite));return}
    const tab=e.target.closest('[data-tab]');if(tab){const [view,name]=tab.dataset.tab.split(':');state[view==='customer'?'customerTab':view==='provider'?'providerTab':'adminTab']=name;render();return}
    const role=e.target.closest('[data-role]');if(role){state.role=role.dataset.role;render();return}
    const el=e.target.closest('[data-action]');if(!el)return;
    const [action,arg,extra]=el.dataset.action.split(':');
    if(action==='profile'){state.selected=Number(arg);navigate('profile')}
    else if(action==='book'){state.selected=Number(arg);navigate('booking')}
    else if(action==='contact')contact(Number(arg));
    else if(action==='favorite')toggleFavorite(Number(arg));
    else if(action==='location')message('Location access is not active in this demo. Enter a neighborhood to explore sample results.');
    else if(action==='results'||action==='customer'||action==='provider'||action==='admin')navigate(action);
    else if(action==='dashboard-role')navigate(state.role.toLowerCase());
    else if(action==='clear-notice'){state.notice='';render()}
    else if(action==='clear-error'){state.searchError=false;render()}
    else if(action==='list'||action==='map'){state.map=action==='map';render()}
    else if(action==='reset-filters'){Object.assign(state,{category:'All',distance:'Any',rating:'Any',price:'Any'});render()}
    else if(action==='clear-search'){Object.assign(state,{query:'',category:'All',distance:'Any',rating:'Any',price:'Any'});render()}
    else if(action==='cancel-booking'){const b=state.bookings.find(x=>x.id===arg);if(b)b.status='Cancelled';message('Demo request cancelled locally.')}
    else if(action==='availability'){state.providerAvailable=!state.providerAvailable;render()}
    else if(action==='request'){state.requests[Number(arg)].status=extra;message('Request '+extra.toLowerCase()+' in demo state.')}
    else if(action==='approve'){state.adminProviders[Number(arg)].status='Approved';message('Verification approved locally for demo purposes.')}
    else if(action==='complaint'){state.complaints[Number(arg)].status='Reviewed';message('Complaint marked reviewed locally.')}
    else if(action==='category-toggle'){const name=categories[Number(arg)].name;state.disabledCategories.has(name)?state.disabledCategories.delete(name):state.disabledCategories.add(name);render()}
  });
  function toggleFavorite(id){state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);render()}
  document.addEventListener('change',e=>{
    const values={'filter-category':'category','filter-distance':'distance','filter-rating':'rating','filter-price':'price','sort':'sort'};
    if(values[e.target.id]){state[values[e.target.id]]=e.target.value;render()}
  });
  function error(id,text){const el=document.getElementById(id+'-error');if(el)el.textContent=text;const input=document.getElementById(id);if(input)input.setAttribute('aria-invalid',text?'true':'false')}
  document.addEventListener('submit',e=>{
    e.preventDefault();const form=e.target;
    if(form.matches('[data-search-form]')){
      const prefix=form.id.replace('-search',''),q=document.getElementById(prefix+'-service').value.trim(),location=document.getElementById(prefix+'-location').value.trim();
      error(prefix+'-location',location?'':'Enter a city or neighborhood.');if(!location)return;
      state.query=q;state.location=location;state.category='All';state.searchError=false;
      root.innerHTML='<div class="wrap py-20 text-center" role="status" aria-live="polite"><div class="inline-block w-9 h-9 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div><p class="mt-4 font-bold">Finding demo providers…</p></div>';
      setTimeout(()=>navigate('results'),380);
    } else if(form.id==='booking-form'){
      const date=document.getElementById('booking-date').value,time=document.getElementById('booking-time').value,address=document.getElementById('booking-address').value.trim();
      const today=new Date();today.setHours(0,0,0,0);
      const validDate=date&&new Date(date+'T00:00:00')>=today;
      error('booking-date',validDate?'':'Choose today or a future date.');
      error('booking-time',time!=='Choose a time'?'':'Choose a time slot.');
      error('booking-address',address.length>=6?'':'Enter a service address of at least 6 characters.');
      if(!validDate||time==='Choose a time'||address.length<6)return;
      const p=providers.find(x=>x.id===state.selected)||providers[0];
      const id='DEMO-'+String(Date.now()).slice(-6);
      state.bookings.unshift({id,provider:p.id,service:p.service,date,time,status:'Upcoming'});
      state.customerTab='Bookings';navigate('customer');message('Demo request '+id+' recorded in this page only. No provider was notified and no payment was taken.');
    } else if(form.id==='profile-form'){
      const name=document.getElementById('profile-name').value.trim(),area=document.getElementById('profile-area').value.trim();
      error('profile-name',name?'':'Enter a display name.');error('profile-area',area?'':'Enter an area.');
      if(!name||!area)return;state.profileName=name;state.profileArea=area;message('Demo profile updated locally.');
    } else if(form.id==='provider-form'){
      const value=Number(document.getElementById('provider-price').value);
      error('provider-price',value>0?'':'Enter a price greater than zero.');
      if(value<=0)return;state.providerPrice=value;providers[0].price=value;message('Sample starting price updated locally.');
    }
  });
  document.getElementById('menu-toggle').addEventListener('click',()=>{
    const nav=document.getElementById('mobile-nav'),open=nav.classList.toggle('open');
    document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open));
    document.getElementById('menu-toggle').setAttribute('aria-label',open?'Close navigation menu':'Open navigation menu');
  });
  document.getElementById('dismiss-banner').addEventListener('click',()=>document.getElementById('demo-banner').remove());
  render();
})();
</script>
 
</body></html>
